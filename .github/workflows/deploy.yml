name: Deploy to AWS

on:
  push:
    branches: [main]
  # Allows a redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Sign in to AWS with the repository's OIDC token — no stored AWS keys. The
# deploy role only trusts this repository's main branch.
permissions:
  contents: read
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-upload.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_ROLE_ARN: arn:aws:iam::426845667337:role/github-deploy-realgoodsocial-website
  S3_BUCKET: realgoodsocial-website-426845667337
  CLOUDFRONT_DISTRIBUTION_ID: E8A6C6DIIQFS8

jobs:
  deploy:
    # No `environment:` here — it would change the OIDC subject the deploy role
    # trusts (repo:JulianOnGit@17049483/real-good-social@1305979570:ref:refs/heads/main).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets first, and never deleted here, so pages already open in a
      # browser can still load the chunks they reference while the HTML changes.
      - name: Upload assets
        run: >
          aws s3 sync build/client/assets "s3://$S3_BUCKET/assets"
          --cache-control "public, max-age=31536000, immutable"

      # Pages and route data: browsers always revalidate, CloudFront caches
      # until the invalidation below.
      - name: Upload pages
        run: >
          aws s3 sync build/client "s3://$S3_BUCKET"
          --delete --exclude "assets/*"
          --cache-control "public, max-age=0, s-maxage=86400"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
